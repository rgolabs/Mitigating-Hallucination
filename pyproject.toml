[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-layered-defense"
version = "0.2.0"
description = "Layered defense framework (verifier, metadata-filtered RAG, negative prompting, alignment) for mitigating LLM hallucinations, with a reproducible ablation harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rajesh Govindarajan", email = "rj@onboardai.org" }]
keywords = ["llm", "hallucination", "rag", "llm-as-a-judge", "prompt-engineering", "ai-safety", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
layered-defense = "layered_defense.cli:main"

[project.urls]
Homepage = "https://github.com/rajeshgovindarajan/llm-layered-defense"
Issues = "https://github.com/rajeshgovindarajan/llm-layered-defense/issues"

[tool.hatch.build]
artifacts = ["src/layered_defense/data/*.csv"]  # data/ is git-ignored at the repo root

[tool.hatch.build.targets.wheel]
packages = ["src/layered_defense"]

[tool.hatch.build.targets.sdist]
include = ["src/layered_defense", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long prompt/data strings
